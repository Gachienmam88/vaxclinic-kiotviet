server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:vaxclinic}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  # Lịch sử thao tác: http (mặc định) | kafka (topic audit.events; broker: SPRING_KAFKA_BOOTSTRAP_SERVERS)
  audit:
    transport: ${AUDIT_TRANSPORT:http}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  security:
    public-paths: /api/auth/login,/api/auth/refresh,/api/auth/store,/api/auth/store-status
  # Sổ quỹ (sales-service) nhận phiếu chi lương / tạm ứng qua outbox; doanh thu người bán để tính hoa hồng
  sales-url: ${SALES_URL:http://localhost:8086}
  hr:
    # Khóa HMAC mã QR chấm công chi nhánh (dẫn xuất lại trong ClockTokenService); thiếu ENCRYPTION_KEY thì dùng JWT secret
    clock-secret: ${ENCRYPTION_KEY:${JWT_SECRET}}
  # Khóa mã hóa khóa TOTP (xác thực 2 lớp) + băm mã khôi phục — dẫn xuất lại trong TotpSecretCipher
  totp:
    secret: ${ENCRYPTION_KEY:${JWT_SECRET}}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
