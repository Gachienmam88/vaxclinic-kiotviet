server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USER:vaxclinic}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  # sales-service (Sổ quỹ) nhận phiếu chi trả NCC qua outbox
  sales-url: ${SALES_URL:http://localhost:8086}
  # identity-service: thiết lập cửa hàng (khóa sổ, cho phép bán âm kho)
  identity-url: ${IDENTITY_URL:http://localhost:8081}
  # integration-service: hủy phiếu nhập / phiếu chi NCC → bỏ "Đã lập phiếu" của hóa đơn đầu vào
  integration-url: ${INTEGRATION_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health
