server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USER:vaxclinic}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  # Lịch sử thao tác: http (mặc định) | kafka (topic audit.events; broker: SPRING_KAFKA_BOOTSTRAP_SERVERS)
  audit:
    transport: ${AUDIT_TRANSPORT:http}
  # Sự kiện nghiệp vụ qua Kafka (event_outbox → Kafka → service khác). false = các luồng chạy HTTP như cũ
  events:
    enabled: ${EVENTS_ENABLED:false}
  # Phiếu thu/chi tự động vào Sổ quỹ (product → sales): http (mặc định) | kafka (topic cashflow.events)
  cashflow:
    transport: ${CASHFLOW_TRANSPORT:http}
  jwt:
    secret: ${JWT_SECRET}
  # sales-service (Sổ quỹ) nhận phiếu chi trả NCC qua outbox
  sales-url: ${SALES_URL:http://localhost:8086}
  # identity-service: thiết lập cửa hàng (khóa sổ, cho phép bán âm kho)
  identity-url: ${IDENTITY_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
