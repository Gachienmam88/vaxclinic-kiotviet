server:
  port: ${GATEWAY_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
  # Giới hạn tần suất (RateLimitFilter): số request / phút / khóa. auth = đăng nhập + 2FA (theo IP),
  # refresh = làm mới / đăng xuất phiên (theo IP), general = còn lại (theo user, chưa đăng nhập theo IP).
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:60}
    general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:900}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # identity-service: auth, users, roles, branches (điểm tiêm)
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/branches/**,/api/settings/**,/api/print-templates/**,/api/audit-logs/**,/api/hr/**,/api/notifications/**,/api/announcements/**,/api/store-profile/**
            # Hồ sơ cửa hàng → Hóa đơn điện tử & Chữ ký số (integration-service) PHẢI khớp trước /api/store-profile/** của identity
            - id: integration-store-profile
              uri: ${INTEGRATION_URL:http://localhost:8088}
              order: -1
              predicates:
                - Path=/api/store-profile/einvoice/**,/api/store-profile/certificates/**
            # product-service: hàng hóa, nhóm hàng, thuế, vị trí, tồn kho, thẻ kho
            # Báo cáo kho / NCC (product-service) PHẢI khớp trước /api/reports/** của sales: order nhỏ hơn được xét trước
            - id: product-reports
              uri: ${PRODUCT_URL:http://localhost:8082}
              order: -1
              predicates:
                - Path=/api/reports/inventory/**,/api/reports/suppliers/**
            - id: product
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/tax-rates/**,/api/positions/**,/api/suppliers/**,/api/purchase-receipts/**,/api/purchase-returns/**,/api/stock-takes/**,/api/stock-issues/**,/api/accounting/stock/**,/api/price-books/**
            # sales-service: khách hàng, hóa đơn, sổ quỹ, công nợ (/internal/** KHÔNG được route ra ngoài)
            - id: sales
              uri: ${SALES_URL:http://localhost:8086}
              predicates:
                - Path=/api/customers/**,/api/invoices/**,/api/cashbook/**,/api/bank-accounts/**,/api/sales-returns/**,/api/accounting/revenue/**,/api/customer-groups/**,/api/orders/**,/api/reports/**,/api/sales-channels/**,/api/delivery-partners/**,/api/shipments/**
            # integration-service: hóa đơn đầu vào (cổng thuế), hóa đơn điện tử MISA
            - id: integration
              uri: ${INTEGRATION_URL:http://localhost:8088}
              predicates:
                - Path=/api/tax-connections/**,/api/input-invoices/**,/api/einvoice/**,/api/einvoices/**,/api/payments/**,/api/payment-requests/**

management:
  endpoints:
    web:
      exposure:
        include: health
