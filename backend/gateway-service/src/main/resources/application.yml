server:
  port: ${GATEWAY_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # identity-service: auth, users, roles, branches (điểm tiêm)
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/branches/**
            # product-service: hàng hóa, nhóm hàng, thuế, vị trí, tồn kho, thẻ kho
            - id: product
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/tax-rates/**,/api/positions/**,/api/suppliers/**,/api/purchase-receipts/**,/api/purchase-returns/**

management:
  endpoints:
    web:
      exposure:
        include: health
