server:
  port: ${GATEWAY_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # identity-service: auth, users, roles, branches (điểm tiêm)
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/branches/**,/api/settings/**,/api/print-templates/**,/api/audit-logs/**,/api/hr/**
            # product-service: hàng hóa, nhóm hàng, thuế, vị trí, tồn kho, thẻ kho
            # Báo cáo kho / NCC (product-service) PHẢI khớp trước /api/reports/** của sales: order nhỏ hơn được xét trước
            - id: product-reports
              uri: ${PRODUCT_URL:http://localhost:8082}
              order: -1
              predicates:
                - Path=/api/reports/inventory/**,/api/reports/suppliers/**
            - id: product
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/tax-rates/**,/api/positions/**,/api/suppliers/**,/api/purchase-receipts/**,/api/purchase-returns/**,/api/stock-takes/**,/api/stock-issues/**,/api/accounting/stock/**,/api/price-books/**
            # sales-service: khách hàng, hóa đơn, sổ quỹ, công nợ (/internal/** KHÔNG được route ra ngoài)
            - id: sales
              uri: ${SALES_URL:http://localhost:8086}
              predicates:
                - Path=/api/customers/**,/api/invoices/**,/api/cashbook/**,/api/bank-accounts/**,/api/sales-returns/**,/api/accounting/revenue/**,/api/customer-groups/**,/api/orders/**,/api/reports/**
            # integration-service: hóa đơn đầu vào (cổng thuế), hóa đơn điện tử MISA
            - id: integration
              uri: ${INTEGRATION_URL:http://localhost:8088}
              predicates:
                - Path=/api/tax-connections/**,/api/input-invoices/**,/api/einvoice/**,/api/einvoices/**,/api/payments/**,/api/payment-requests/**

management:
  endpoints:
    web:
      exposure:
        include: health
