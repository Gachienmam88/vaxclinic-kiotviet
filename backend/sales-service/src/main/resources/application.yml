server:
  port: 8086

spring:
  application:
    name: sales-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_db}
    username: ${DB_USER:vaxclinic}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  # Lịch sử thao tác: http (mặc định) | kafka (topic audit.events; broker: SPRING_KAFKA_BOOTSTRAP_SERVERS)
  audit:
    transport: ${AUDIT_TRANSPORT:http}
  jwt:
    secret: ${JWT_SECRET}
  # product-service: trừ / hoàn kho khi bán, hủy hóa đơn
  product-url: ${PRODUCT_URL:http://localhost:8082}
  # identity-service: thiết lập cửa hàng (khóa sổ, quy tắc đơn hàng, khách hàng)
  identity-url: ${IDENTITY_URL:http://localhost:8081}
  # integration-service: trạng thái hóa đơn điện tử (chặn sửa/hủy HĐ đã phát hành)
  integration-url: ${INTEGRATION_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health
