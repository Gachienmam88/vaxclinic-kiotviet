server:
  port: 8086

spring:
  application:
    name: sales-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_db}
    username: ${DB_USER:vaxclinic}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  # product-service: trừ / hoàn kho khi bán, hủy hóa đơn
  product-url: ${PRODUCT_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
