# Dev stack. Copy .env.example -> .env and fill secrets first.
#   Chỉ hạ tầng:          docker compose up -d
#   Hạ tầng + backend:     docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  identity-service:
    profiles: [app]
    build: { context: ./backend, args: { MODULE: identity-service } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    profiles: [app]
    build: { context: ./backend, args: { MODULE: product-service } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SALES_URL: http://sales-service:8086
    depends_on:
      postgres: { condition: service_healthy }

  sales-service:
    profiles: [app]
    build: { context: ./backend, args: { MODULE: sales-service } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sales_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_URL: http://product-service:8082
    depends_on:
      postgres: { condition: service_healthy }

  gateway-service:
    profiles: [app]
    build: { context: ./backend, args: { MODULE: gateway-service } }
    environment:
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_URL: http://identity-service:8081
      PRODUCT_URL: http://product-service:8082
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on: [identity-service, product-service]

volumes:
  pgdata:
  miniodata:
