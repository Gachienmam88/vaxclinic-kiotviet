# CI: kiểm tra mọi nhánh / pull request. Không dùng secret nào.
# Nhánh main được kiểm tra bên trong CD (workflow_call) để không chạy 2 lần.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      # Unit tests are plain JUnit (no Spring context / DB), so no Postgres service is needed.
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_NAME: VaxClinic
      GATEWAY_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json is written by npm 11 on the dev machine; npm 10 (bundled with Node 22) rejects it.
      - name: Use npm 11 (same as dev machine)
        run: npm install -g npm@11.6.2 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint (errors only)
        run: npx eslint . --quiet
      - name: Unit tests
        run: node --experimental-strip-types --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml tests/*.test.mjs
      - name: Build
        run: npx next build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
          if-no-files-found: ignore
          retention-days: 14
