# CD: đóng gói Docker image lên GHCR khi có code mới trên main, rồi (nếu đã cấu hình máy chủ) triển khai qua SSH.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: this commit SHA). Use an older SHA to roll back manually."
        required: false

concurrency:
  group: cd-main
  cancel-in-progress: false   # never cancel a deploy half-way

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI
    if: github.event_name == 'push' || inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  images:
    name: Build image ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: identity-service,    context: backend,  module: identity-service }
          - { service: product-service,     context: backend,  module: product-service }
          - { service: sales-service,       context: backend,  module: sales-service }
          - { service: integration-service, context: backend,  module: integration-service }
          - { service: gateway-service,     context: backend,  module: gateway-service }
          - { service: frontend,            context: frontend, module: "" }
    steps:
      - uses: actions/checkout@v5
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.module != '' && format('MODULE={0}', matrix.module) || '' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    needs: images
    # deploy new images only if CI + build succeeded; a manual run with an explicit tag (rollback) skips the build
    if: ${{ !cancelled() && (needs.images.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production     # enable "Required reviewers" on this environment for manual approval
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/vaxclinic' }}
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - name: Check deploy configuration
        id: cfg
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice title=Deploy skipped::Chưa cấu hình máy chủ (cần secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY). Image đã lên GHCR, bỏ qua bước triển khai."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.enabled == 'true'

      - name: Set up SSH
        if: steps.cfg.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set - trusting host key from ssh-keyscan"
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config

      - name: Upload compose + deploy script
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp infra/deploy/docker-compose.prod.yml infra/deploy/deploy.sh infra/postgres/init-databases.sql "target:$DEPLOY_PATH/"
          ssh target "chmod +x '$DEPLOY_PATH/deploy.sh'"

      - name: Deploy (backup -> pull -> up -> health check -> rollback on failure)
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh target "IMAGE_PREFIX='$IMAGE_PREFIX' '$DEPLOY_PATH/deploy.sh' '$TAG'"

      - name: Log out of GHCR on server
        if: always() && steps.cfg.outputs.enabled == 'true'
        run: ssh target "docker logout ghcr.io" || true
